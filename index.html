<style>

    background: #08090B; color: #EDEBE6; text-align: center; padding: 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); font-weight: 700; letter-spacing: -.02em; margin: 0; }

  }

</style>
</head>
<body>
